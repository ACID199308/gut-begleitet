name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  local-app-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-web.mjs
      - run: node scripts/check.mjs
      - run: node scripts/prepare-ios.mjs
      - run: node scripts/check-ios.mjs
  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare local iOS content
        run: |
          node scripts/build-web.mjs
          node scripts/prepare-ios.mjs
          node scripts/check-ios.mjs
      - name: Build iOS app without signing
        run: |
          mkdir -p build
          xcodebuild -project ios/GutBegleitet.xcodeproj -scheme GutBegleitet -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build > build/ios-build.log 2>&1 || { tail -n 140 build/ios-build.log; exit 1; }
      - name: Build unsigned iPhone app
        run: |
          xcodebuild -project ios/GutBegleitet.xcodeproj -scheme GutBegleitet -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/ios-device CODE_SIGNING_ALLOWED=NO build > build/ios-device-build.log 2>&1 || { tail -n 140 build/ios-device-build.log; exit 1; }
          node scripts/package-ios-device.mjs
      - name: Save unsigned iPhone package
        uses: actions/upload-artifact@v4
        with:
          name: GutBegleitet-iOS-Geraet-unsigniert
          path: build/GutBegleitet-iOS-unsigniert.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Run on iPhone simulator
        run: node scripts/smoke-ios.mjs
      - name: Save simulator app and verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GutBegleitet-iOS-Simulator
          path: |
            build/GutBegleitet-iOS-Simulator.zip
            build/ios-simulator*.png
            build/ios-smoke-result.json
            build/ios-build.log
            build/ios-device-build.log
          retention-days: 14
