name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  local-app-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-web.mjs
      - run: node scripts/check.mjs
